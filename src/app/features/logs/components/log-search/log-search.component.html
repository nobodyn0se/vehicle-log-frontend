<form [formGroup]="form" (ngSubmit)="onSubmit()" class="search-form">
  <mat-form-field appearance="outline">
    <mat-label>Vehicle ID</mat-label>
    <input matInput formControlName="vehicleId" placeholder="Enter Vehicle ID" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Error Code</mat-label>
    <input matInput formControlName="code" placeholder="Enter Error Code" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Start Timestamp</mat-label>
    <input matInput type="date" formControlName="startDate" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>End Timestamp</mat-label>
    <input matInput type="date" formControlName="endDate" />
  </mat-form-field>

  <div class="actions">
    <button mat-raised-button color="primary" type="submit">Search</button>
    <button mat-stroked-button type="button" (click)="onReset()">Reset</button>
  </div>
</form>
